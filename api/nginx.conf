# Forwards the Swagger UI "Try it out" calls to the build listening on the host's port 8080 and adds
# the CORS headers the browser needs, so neither the monolith nor the gateway has to know about CORS.
server {
    listen 8082;
    client_max_body_size 8m;   # above the 5 MiB image limit, so the API itself answers the 413

    location / {
        add_header Access-Control-Allow-Origin  "http://localhost:8081" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       600 always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }
}
