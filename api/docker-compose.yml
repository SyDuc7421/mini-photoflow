# API docs for either build. Start the monolith or the microservices on :8080 first, then:
#   docker compose -f api/docker-compose.yml up -d
# and open http://localhost:8081 (Swagger UI, reads api/openapi.yaml).
# The page calls the API through :8082, a small CORS proxy to the host's :8080.
services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      PERSIST_AUTHORIZATION: "true"   # keep the pasted token across page reloads
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "127.0.0.1:8081:8080"

  cors-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8082"
