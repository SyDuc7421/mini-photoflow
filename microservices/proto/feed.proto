syntax = "proto3";

package photoshare.feed;

option go_package = "photoshare/microservices/pb/feedpb";

service Feed {
  rpc GetFeed(GetFeedRequest) returns (GetFeedReply);
}

// `before` is the opaque cursor from a previous reply; empty means the first page.
// The caller's user id travels in the `x-user-id` metadata.
message GetFeedRequest {
  reserved 1;
  string before = 2;
  int32 limit = 3;
}

message Item {
  int64 id = 1;
  string author = 2;
  string caption = 3;
  string image_url = 4;
  int32 likes = 5;
  int32 comments = 6;
  bool liked_by_me = 7;
  int64 created_at_micro = 8;
}

// `next` is empty on the last page.
message GetFeedReply {
  repeated Item items = 1;
  string next = 2;
}
