syntax = "proto3";

package photoshare.auth;

option go_package = "photoshare/microservices/pb/authpb";

service Auth {
  rpc Register(Credentials) returns (User);
  rpc Login(Credentials) returns (Token);
  rpc UserExists(UserRef) returns (ExistsReply);
  rpc GetUsers(GetUsersRequest) returns (GetUsersReply);
}

message Credentials {
  string username = 1;
  string password = 2;
}

message User {
  int64 id = 1;
  string username = 2;
}

message Token {
  string token = 1;
}

message UserRef {
  int64 id = 1;
}

message ExistsReply {
  bool exists = 1;
}

message GetUsersRequest {
  repeated int64 ids = 1;
}

// names maps user id to username; unknown ids are absent.
message GetUsersReply {
  map<int64, string> names = 1;
}
